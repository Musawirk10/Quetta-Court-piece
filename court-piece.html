<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082018">
<title>♠ Court Piece 52 — 4 Player Tash Game</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Tahoma,sans-serif;
    background:radial-gradient(1400px 900px at 50% 6%, #123f2e 0%, #082018 55%, #05130d 100%);
    color:#f2ecdc; height:100vh; height:100dvh; overflow:hidden; user-select:none;
    touch-action:manipulation;
  }
  :root{
    --gold:#e7c568;
    --gold-soft:#f3e3ac;
    --cw: clamp(44px, calc((100vw - 30px) / 7.6), 78px);
    --cw-s: clamp(40px, 12.5vmin, 62px);
  }
  @media (min-width:900px){ :root{ --cw: clamp(64px, 7vw, 86px); } }
  #app{display:flex;flex-direction:column;height:100%;}

  /* ============ HUD ============ */
  .hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch;padding:8px 8px 0;flex:none}
  #teamUs{justify-self:start;width:100%;max-width:290px}
  #teamThem{justify-self:end;width:100%;max-width:290px}
  .team-pill{background:linear-gradient(160deg, rgba(27,74,54,.95), rgba(10,34,24,.97));border:1px solid rgba(231,197,104,.3);border-radius:12px;padding:5px 10px;display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06)}
  .team-pill.them{text-align:right;align-items:flex-end;border-color:rgba(159,212,187,.22)}
  .tname{font-size:8.5px;letter-spacing:.16em;color:var(--gold);font-weight:800;white-space:nowrap}
  .team-pill.them .tname{color:#9fd4bb}
  .names{font-size:11px;font-weight:700;color:#e9f2ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .trow{display:flex;gap:8px;align-items:center;font-size:10px;color:#b9cdbf}
  .stars{letter-spacing:2px;font-size:10px;color:#4f6357}
  .stars .on{color:var(--gold);text-shadow:0 0 6px rgba(231,197,104,.7)}
  .hud-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:66px}
  .trump-badge{width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,#fdf7e7,#e6d9b8);color:#101a14;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.45), inset 0 0 0 2px rgba(0,0,0,.08);line-height:1}
  .trump-badge.red{color:#a32018}
  .trump-badge.none{color:#7c8a7f;font-size:15px;font-weight:800}
  .mini-lbl{font-size:7.5px;letter-spacing:.22em;color:#cfdcae;opacity:.85}
  .hakim-lbl{font-size:9px;color:#cbd9cd;white-space:nowrap;max-width:104px;overflow:hidden;text-overflow:ellipsis}

  /* ============ TABLE ============ */
  .table{position:relative;flex:1 1 auto;min-height:0;margin:8px;border-radius:20px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 42%, #177a4e 0%, #0d5a39 42%, #07351f 78%, #052516 100%);
    box-shadow:inset 0 0 70px rgba(0,0,0,.55), inset 0 0 0 2px rgba(231,197,104,.10), 0 16px 50px rgba(0,0,0,.55);
    border:1px solid rgba(231,197,104,.18);
  }
  .table::before{content:'';position:absolute;inset:10px;border-radius:16px;border:1px solid rgba(231,197,104,.14);pointer-events:none;z-index:1}
  .table::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:5px 5px;opacity:.5;pointer-events:none;z-index:1}
  .table-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:30}
  .icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(231,197,104,.35);background:rgba(4,16,10,.6);color:#ecdfb6;font-size:14px;display:grid;place-items:center;cursor:pointer;padding:0}
  .icon-btn:active{transform:scale(.94)}

  /* ============ SEATS ============ */
  .seat{position:absolute;z-index:8;display:flex;justify-content:center;pointer-events:none}
  .seat-top{top:6px;left:50%;transform:translateX(-50%)}
  .seat-bottom{bottom:4px;left:50%;transform:translateX(-50%)}
  .seat-left{left:6px;top:50%;transform:translateY(-50%)}
  .seat-right{right:6px;top:50%;transform:translateY(-50%)}
  .seat-inner{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:14px;transition:background .3s, box-shadow .3s}
  .seat-inner.active{background:rgba(231,197,104,.08);box-shadow:0 0 0 1px rgba(231,197,104,.35), 0 0 22px rgba(231,197,104,.18)}
  .avatar{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#0b1a12;background:linear-gradient(160deg,#f2e3b6,#d9b96a);border:2px solid rgba(255,255,255,.55);box-shadow:0 3px 10px rgba(0,0,0,.45)}
  .seat-inner.them .avatar{background:linear-gradient(160deg,#bfe0cf,#8fbfa6)}
  .seat-inner.active .avatar{animation:pulseGlow 1.4s ease-in-out infinite}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 2px rgba(231,197,104,.35), 0 0 14px rgba(231,197,104,.25)}50%{box-shadow:0 0 0 3px rgba(231,197,104,.85), 0 0 22px rgba(231,197,104,.55)}}
  .crown{position:absolute;top:-13px;left:50%;transform:translateX(-50%);display:flex;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .streak-badge{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;border-radius:999px;background:#2a5c43;color:#eaf5ea;font-size:10px;font-weight:800;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.55);padding:0 3px;line-height:1}
  .streak-badge.hot{background:linear-gradient(160deg,#f3dd9d,#dbb75c);color:#1a2418;border-color:#fff;box-shadow:0 0 10px rgba(231,197,104,.85);animation:pulseGlow 1.2s ease-in-out infinite}
  .pts{display:inline-flex;align-items:center;gap:2px;flex:none}
  .pt{width:5px;height:5px;border-radius:50%;background:#3d5648;display:inline-block}
  .pt.on{background:var(--gold);box-shadow:0 0 5px rgba(231,197,104,.85)}
  .got{color:#cfe0cf;font-weight:700}
  .nm{font-size:11px;font-weight:800;color:#eef4e8;max-width:94px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .role{font-size:8px;letter-spacing:.14em;color:#a9c0b0;text-transform:uppercase}
  .role.partner{color:#e7c568}
  .seat-row{display:flex;align-items:center;gap:7px;pointer-events:auto}
  .call-btn{border-radius:999px;padding:6px 9px;font-size:9.5px;font-weight:900;letter-spacing:.08em;cursor:pointer;border:1px solid;font-family:inherit;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  .call-btn.kot{background:linear-gradient(160deg,#f3dd9d,#dbb75c);color:#20180a;border-color:rgba(255,255,255,.5)}
  .call-btn.peace{background:linear-gradient(160deg,#bfe0cf,#8fbfa6);color:#0d2218;border-color:rgba(255,255,255,.45)}
  .call-btn:active{transform:scale(.95)}
  .call-btn[disabled]{opacity:.32;pointer-events:none}
  .slam-btn{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid rgba(255,255,255,.35);background:linear-gradient(160deg,#3a2c18,#241a0e);box-shadow:0 3px 10px rgba(0,0,0,.4);padding:0;flex:none}
  .slam-btn.on{background:linear-gradient(160deg,#f3dd9d,#c9962e);border-color:#fff;box-shadow:0 0 16px rgba(231,197,104,.8);animation:pulseGlow 1s ease-in-out infinite}
  .slam-btn:active{transform:scale(.92)}
  .slot.slam .card{animation:slamIn .26s cubic-bezier(.2,1.55,.4,1)}
  @keyframes slamIn{0%{transform:translateY(-46px) scale(1.38);opacity:.25}55%{transform:translateY(4px) scale(.95);opacity:1}100%{transform:none}}
  .dust{position:fixed;width:13px;height:13px;border-radius:50%;background:rgba(210,184,132,.95);box-shadow:0 0 6px rgba(201,175,125,.5);pointer-events:none;z-index:130;transform:translate(-50%,-50%) scale(var(--s,1));animation:dustUp .8s ease-out forwards}
  @keyframes dustUp{0%{opacity:.95;transform:translate(-50%,-50%) scale(calc(var(--s,1)*.45))}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,-30px))) scale(calc(var(--s,1)*1.5))}}
  #app.screen-shake{animation:shk .4s ease-out}
  @keyframes shk{0%{transform:translate(0,0) rotate(0)}12%{transform:translate(-11px,7px) rotate(-.5deg)}26%{transform:translate(10px,-6px) rotate(.45deg)}40%{transform:translate(-8px,5px) rotate(-.35deg)}55%{transform:translate(7px,-4px) rotate(.3deg)}72%{transform:translate(-5px,3px) rotate(-.2deg)}88%{transform:translate(3px,-2px) rotate(.1deg)}100%{transform:translate(0,0) rotate(0)}}
  .reveal{background:rgba(4,16,10,.9);border:1px solid rgba(231,197,104,.5);border-radius:8px;padding:3px 7px;font-size:9.5px;line-height:1.45;color:#f0e3bb;font-family:Georgia,serif;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45);margin-top:1px}
  .reveal .rv-red{color:#e05a4e}
  .reveal .rv-h{font-size:6.5px;letter-spacing:.14em;color:var(--gold);font-family:inherit;font-weight:800;display:block;margin-bottom:1px}
  .modal.w-reveal{width:min(780px,100%)}
  .reveal-hand{margin-top:10px}
  .reveal-hand .rv-name{font-size:11px;font-weight:800;letter-spacing:.06em;color:#f6e7b8;text-align:center;margin-bottom:2px}
  .reveal-hand .hand{min-height:calc(var(--cw)*1.42);max-width:100%;padding:0}
  .reveal-hand .card{--c:min(var(--cw), calc((min(100vw, 780px) - 70px)/7.8));margin-left:calc(var(--c)*-.44)}
  .reveal-hand .card:first-child{margin-left:0}
  .mini{display:flex;justify-content:center;align-items:flex-start;height:21px;margin-top:1px}
  .mb{width:11px;height:16px;border-radius:3px;border:1px solid #ecd9a6;background:repeating-linear-gradient(135deg,#7e2033 0 3px,#9c2a42 3px 6px);margin-left:-6px;box-shadow:0 1px 2px rgba(0,0,0,.5);transform-origin:bottom center}
  .mb:first-child{margin-left:0}

  /* ============ TRICK GRID ============ */
  .trick-grid{position:absolute;inset:0;z-index:5}
  .slot{position:absolute;width:var(--cw-s);height:calc(var(--cw-s)*1.44);transform:translate(-50%,-50%);display:grid;place-items:center}
  .slot-top{left:50%;top:25%}.slot-bottom{left:50%;top:77%}
  .slot-left{left:29%;top:50%}.slot-right{left:71%;top:50%}
  .slot .card{animation:none} /* played card seedha rahe - koi blink nahi */
  .ghost{width:var(--cw-s);height:calc(var(--cw-s)*1.44);border:1px dashed rgba(255,255,255,.16);border-radius:6px;background:rgba(0,0,0,.06)}
  .center-col{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
  .pile-pill{display:flex;align-items:center;gap:5px;background:rgba(4,16,10,.68);border:1px solid rgba(231,197,104,.42);border-radius:999px;padding:2px 10px;font-size:11px;color:#f0e3bb;font-weight:700;white-space:nowrap;transition:opacity .2s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .pile-pill b{color:#fff;font-size:14px}
  .pile-pill.empty{opacity:.42}
  .stack{position:relative;width:15px;height:12px;display:inline-block;flex:none}
  .stack i{position:absolute;width:9px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,#7e2033 0 2px,#9c2a42 2px 4px);border:1px solid #e3cf95;left:0;top:0}
  .stack i:nth-child(2){left:3px;top:-2px}
  .stack i:nth-child(3){left:6px;top:-4px}
  .need-pill{font-size:9.5px;letter-spacing:.08em;color:#d7e3d3;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .need-pill b{color:var(--gold);font-size:11px}
  .left-stack{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:9}
  .rang-badge{position:relative;width:clamp(50px,13vmin,70px);height:clamp(50px,13vmin,70px);border-radius:50%;background:radial-gradient(circle at 35% 30%, #1d6b4a, #0a3b26 70%);border:1px solid rgba(231,197,104,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 14px rgba(0,0,0,.5), 0 0 20px rgba(0,0,0,.35);z-index:9}
  .rang-badge .suit{font-size:clamp(21px,5.6vmin,30px);line-height:1;color:#f5efdc}
  .rang-badge .lbl{font-size:7.5px;letter-spacing:.2em;color:var(--gold-soft);margin-top:1px;font-weight:700}
  .rang-badge.red .suit{color:#e05a4e}
  .chakka-badge{font-size:8px;font-weight:900;letter-spacing:.1em;color:#20180a;background:linear-gradient(160deg,#f3dd9d,#dbb75c);border-radius:999px;padding:2px 8px;box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap}
  .chakka-badge.denied{background:linear-gradient(160deg,#bfe0cf,#8fbfa6)}
  .khowasha{margin:12px 2px 2px;border:1px solid rgba(231,197,104,.35);border-radius:12px;padding:9px 10px 10px;background:rgba(231,197,104,.07)}
  .khowasha-title{font-size:9.5px;letter-spacing:.22em;font-weight:800;color:var(--gold-soft);text-align:center;margin-bottom:8px}
  .khowasha-row{display:flex;gap:9px;justify-content:center}
  .khowasha-btn{flex:1;max-width:136px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 7px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.22);color:#e9f0ea;cursor:pointer}
  .khowasha-btn .kmark{font-size:16px;line-height:1;font-weight:900}
  .khowasha-btn .kname{font-size:11.5px;font-weight:800;letter-spacing:.04em}
  .khowasha-btn .ksub{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  .khowasha-btn.k-sahi .kmark{color:#7fe0a8}
  .khowasha-btn.k-ghalat .kmark{color:#ff8f85}
  .khowasha-btn.on{transform:translateY(-1px)}
  .khowasha-btn.k-sahi.on{background:rgba(90,200,140,.34);border-color:#9ff0c0;box-shadow:0 0 18px rgba(127,224,168,.6), inset 0 1px 0 rgba(255,255,255,.18);color:#eafff3}
  .khowasha-btn.k-ghalat.on{background:rgba(224,90,90,.32);border-color:#ff9f96;box-shadow:0 0 18px rgba(255,143,133,.6), inset 0 1px 0 rgba(255,255,255,.14);color:#ffeceb}
  .khowasha-btn.static{cursor:default}
  .kmark.m-sahi{color:#7fe0a8}
  .kmark.m-ghalat{color:#ff8f85}
  .khowasha-partner{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;padding-top:7px;border-top:1px solid rgba(231,197,104,.18)}
  .khowasha-partner .kp-name{font-size:10px;letter-spacing:.08em;color:#cfe0d4;font-weight:700}
  .khowasha-partner .kp-mark{font-size:10.5px;font-weight:900;letter-spacing:.06em;padding:2px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
  .khowasha-partner .kp-mark.sahi{color:#7fe0a8;border-color:#7fe0a8;background:rgba(90,200,140,.15)}
  .khowasha-partner .kp-mark.ghalat{color:#ff8f85;border-color:#ff8f85;background:rgba(224,90,90,.15)}
  .rang-badge.none .suit{color:#9fb3a5;font-weight:800;font-size:clamp(14px,4vmin,20px)}

  /* ============ CARDS ============ */
  .card{--c:64px;position:relative;flex:none;width:var(--c);height:calc(var(--c)*1.44);border-radius:calc(var(--c)*.13);
    background:linear-gradient(155deg,#fffdf6 0%, #f6f0df 62%, #ece2c8 100%);
    color:#1b241e;border:1px solid rgba(20,30,20,.22);
    box-shadow:0 2px 6px rgba(0,0,0,.38), inset 0 1px 0 #fff;
    font-family:Georgia,'Times New Roman',serif;
    transition:transform .12s ease, opacity .2s ease, box-shadow .2s ease;
  }
  .card.red{color:#b3261e}
  .card .r,.card .rb{position:absolute;display:flex;flex-direction:column;align-items:center;font-size:calc(var(--c)*.30);font-weight:700;line-height:.95}
  .card .r{top:3.5%;left:8%}
  .card .rb{bottom:3.5%;right:8%;transform:rotate(180deg)}
  .card .r .s,.card .rb .s{font-size:calc(var(--c)*.24);line-height:1;margin-top:2%}
  .card.ten .r,.card.ten .rb{font-size:calc(var(--c)*.255)}
  .card .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--c)*.62);padding-top:6%;opacity:.95}
  .slot .card{--c:var(--cw-s);box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 1px 0 #fff;animation:none}
  .card.back{background:repeating-linear-gradient(135deg,#7e2033 0 6px,#9c2a42 6px 12px);border:1px solid #e3cf95;box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 2px 6px rgba(0,0,0,.4)}
  .card.back::after{content:'';position:absolute;inset:12%;border:1px solid rgba(255,255,255,.28);border-radius:calc(var(--c)*.07)}
  .card.dealt{animation:dealIn .16s ease-out}
  @keyframes dealIn{from{transform:translateY(-14px) scale(.86);opacity:0}to{transform:none;opacity:1}}
  .card.win{box-shadow:0 0 0 2.5px var(--gold), 0 0 20px rgba(231,197,104,.85), inset 0 1px 0 #fff !important}
  @keyframes popIn{from{transform:scale(.8) translateY(6px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

  /* ============ HAND ============ */
  .handbar{flex:none;padding:2px 6px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:3px}
  .status{font-size:11px;color:#d7e3d3;display:flex;align-items:center;gap:6px;min-height:16px;text-align:center}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(231,197,104,.8);animation:blink 1s infinite;flex:none}
  .status .dot.dim{background:#5d7466;box-shadow:none;animation:none}
  @keyframes blink{50%{opacity:.35}}
  .hand{display:flex;align-items:flex-end;justify-content:center;min-height:calc(var(--cw)*1.5);width:100%;max-width:800px;padding:0 8px}
  .hand .card{--c:var(--cw);margin-left:calc(var(--cw)*-.44);box-shadow:0 2px 5px rgba(0,0,0,.4), inset 0 1px 0 #fff}
  .hand .card:first-child{margin-left:0}
  .hand .card.play{cursor:pointer;box-shadow:0 0 0 2px var(--gold), 0 5px 12px rgba(0,0,0,.45), inset 0 1px 0 #fff;transform:translateY(-5px)}
  .hand .card.play:hover{transform:translateY(-14px);z-index:60}
  .hand .card.dim{opacity:.28;filter:grayscale(.55)}
  .hand .card:hover{z-index:61}

  /* ============ MODALS ============ */
  #modalRoot .overlay{position:fixed;inset:0;z-index:100;background:rgba(2,10,6,.74);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px}
  .modal{width:min(520px,100%);max-height:94dvh;overflow:auto;background:linear-gradient(180deg,#103026,#0a2018);border:1px solid rgba(231,197,104,.4);border-radius:18px;padding:18px 16px;box-shadow:0 30px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04);animation:popOver .22s ease-out}
  @keyframes popOver{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:700;color:#f6e7b8;text-align:center;letter-spacing:.02em}
  .modal-head .gold{color:var(--gold)}
  .sub{font-size:12px;color:#b9cdbf;text-align:center;line-height:1.55;margin:6px 0 14px}
  .hint{font-size:10px;color:#93a99a;text-align:center;margin:10px 0 0;line-height:1.55}
  .team-block{border:1px solid rgba(231,197,104,.16);border-radius:12px;padding:10px;margin-bottom:10px;background:rgba(255,255,255,.03)}
  .team-block.b .tb-title{color:#9fd4bb}
  .tb-title{font-size:9px;letter-spacing:.16em;color:var(--gold);font-weight:800;margin-bottom:7px;text-transform:uppercase}
  .id-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .id-field{display:flex;flex-direction:column;gap:3px;font-size:9px;color:#a9c0b0;letter-spacing:.14em}
  .id-field input{background:rgba(255,255,255,.07);border:1px solid rgba(231,197,104,.25);border-radius:9px;color:#f2ecdc;padding:9px 10px;font-size:14px;font-weight:600;outline:none;font-family:inherit;width:100%}
  .id-field input:focus{border-color:var(--gold);background:rgba(231,197,104,.1)}
  .seat-choice{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}
  .seat-choice.two{grid-template-columns:repeat(2,1fr)}

<script>
'use strict';
/* ============================================================
   COURT PIECE 52 — 4 IDs, 2 Teammates, 13 Tricks, 3 Courts
   Team A: ID 1 & ID 3   ·   Team B: ID 2 & ID 4
   ============================================================ */

/* ---------- constants ---------- */
const SUIT_ORDER = ['S','H','D','C'];
const SUIT_CH = {S:'♠', H:'♥', D:'♦', C:'♣'};
const SNAME = {S:'Spades', H:'Hearts', D:'Diamonds', C:'Clubs'};
const RANKS = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
const RV = {A:14, K:13, Q:12, J:11, '10':10, 9:9, 8:8, 7:7, 6:6, 5:5, 4:4, 3:3, 2:2};
const isRed = s => s === 'H' || s === 'D';
const CROWN_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="#e7c568"><path d="M2.5 8.2l4.9 3.2L12 4.6l4.6 6.8 4.9-3.2-1.7 9.4H4.2L2.5 8.2z"/><rect x="4.4" y="18.6" width="15.2" height="2.1" rx="1"/></svg>';
const SLAM_SVG = '<svg viewBox="0 0 28 28" width="21" height="21" aria-hidden="true">' +
  '<g transform="rotate(14 14 9)"><rect x="8.2" y="1.6" width="11.6" height="14.4" rx="1.8" fill="#f7f0dd" stroke="#1b2a1c" stroke-width="1.3"/><path d="M14 5.2l1.8 2.7-1.8 2.7-1.8-2.7z" fill="#b3261e"/></g>' +
  '<path d="M7.2 14.2c-1.3 1.1-1.6 3-.6 4.3l2.1 2.7c1.2 1.6 2.9 2.4 5 2.4h2.9c2.9 0 4.7-1.8 4.7-4.5v-2.2c0-1-.8-1.7-1.8-1.7h-3.4c.5-.9 0-1.8-1-1.8h-2.2c-1.4 0-2.4.8-2.9 1.8z" fill="#e9c49c" stroke="#1b2a1c" stroke-width="1.3" stroke-linejoin="round"/>' +
  '<path d="M12.3 18.2h7.4M11.8 20.7h8.2" stroke="#1b2a1c" stroke-width="1.1" stroke-linecap="round" opacity=".75"/>' +
  '<path d="M3.4 6.5v5.2M24.6 6.5v5.2M1.9 12.6l1.7-1.9M26.1 12.6l-1.7-1.9" stroke="#f3dd9d" stroke-width="1.7" stroke-linecap="round"/>' +
  '<path d="M6 26.2h16M9.5 24.6l-2 1.6M18.5 24.6l2 1.6" stroke="#f3dd9d" stroke-width="1.5" stroke-linecap="round"/></svg>';
const TROPHY_SVG = '<svg viewBox="0 0 24 24" width="24" height="24" fill="#e7c568"><path d="M7 3h10v4.2A5 5 0 0 1 7 7.2V3z"/><path d="M7 4.4H3.6a3.4 3.4 0 0 0 3.4 3.6M17 4.4h3.4a3.4 3.4 0 0 1-3.4 3.6" stroke="#e7c568" stroke-width="1.5" fill="none"/><path d="M10.4 13.2h3.2v2.9h4.1v2.2H6.3v-2.2h4.1v-2.9z"/></svg>';

/* ---------- tiny helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cap = s => s[0].toUpperCase() + s.slice(1);
const initial = n => { const t = String(n || '').trim(); return t ? t[0].toUpperCase() : '?'; };
const teamOf = seat => seat % 2;
const partnerOf = seat => (seat + 2) % 4;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function makeDeck(){
  const d = [];
  for (const s of SUIT_ORDER) for (const r of RANKS) d.push({r, s, id: r + s});
  return d;
}
/* Hath ki tarteeb:
   kala pan (♠) → eent (♦) → chirhi (♣) → lal pan (♥)
   Yani kale aur surkh kabhi milte nahi. Agar koi suit na ho to
   doosre rang ka patta darmiyan daal diya jata hai. */
function suitLayout(presentSuits){
  const blacks = ['S', 'C'].filter(x => presentSuits.has(x));   // kala pan, chirhi
  const reds   = ['D', 'H'].filter(x => presentSuits.has(x));   // eent, lal pan
  if (!blacks.length) return reds.slice();
  if (!reds.length)   return blacks.slice();

  // do tarteeben banao: ek kala se shuru, ek surkh se
  const build = (startBlack) => {
    const out = [];
    let b = 0, r = 0, black = startBlack;
    while (b < blacks.length || r < reds.length){
      if (black && b < blacks.length){ out.push(blacks[b++]); black = false; }
      else if (!black && r < reds.length){ out.push(reds[r++]); black = true; }
      else if (b < blacks.length){ out.push(blacks[b++]); }
      else if (r < reds.length){ out.push(reds[r++]); }
      else break;
    }
    return out;
  };
  const violations = (arr) => {
    let v = 0;
    for (let i = 1; i < arr.length; i++){
      const a = arr[i-1], b = arr[i];
      if (a === b) continue;
      const aBlack = (a === 'S' || a === 'C'), bBlack = (b === 'S' || b === 'C');
      if (aBlack === bBlack) v++;      // do kale ya do surkh saath saath = mix
    }
    return v;
  };
  const priority = { S: 0, D: 1, C: 2, H: 3 };   // kala pan > eent > chirhi > lal pan
  const cands = [build(true), build(false)];
  cands.sort((x, y) => violations(x) - violations(y) || priority[x[0]] - priority[y[0]]);
  return cands[0];
}

function sortHand(hand, trump){
  const present = new Set(hand.map(c => c.s));
  const layout = suitLayout(present);
  const pos = {};
  layout.forEach((su, i) => { pos[su] = i; });
  return hand.slice().sort((a, b) => {
    const pa = (pos[a.s] != null ? pos[a.s] : 9);
    const pb = (pos[b.s] != null ? pos[b.s] : 9);
    return pa - pb || RV[b.r] - RV[a.r];
  });
}

/* ---------- state ---------- */
let G = null;
let GEN = 0;          // generation counter: stale timers die instantly
let SPEED = 1;        // animation time multiplier (tests use tiny values)
let soundOn = true;
let toastTimer = null;

let setup = { names: ['Ali', 'Bilal', 'Sara', 'Hamza'], humanSeat: 0, target: 7, streakMode: 'player' };
let draft = { names: setup.names.slice(), humanSeat: setup.humanSeat, streakMode: setup.streakMode };
const stats = { matches: 0, rounds: 0, results: [], hakimLog: [] };

function later(ms, fn){
  if (typeof netIsClient === 'function' && netIsClient()) return;   // online client: sirf host chalata he
  const g = GEN;
  const run = () => {
    if (g !== GEN) return;
    if (G && G.paused){ setTimeout(run, 200); return; }
    fn();
  };
  setTimeout(run, Math.max(0, ms * SPEED));
}
let NOTICE = null;      // {text, until}
function toast(msg){
  NOTICE = {text: msg, until: Date.now() + 2400};
  renderStatus();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (NOTICE && Date.now() >= NOTICE.until){ NOTICE = null; renderStatus(); } }, 2450);
}

/* ============================================================
   SOUND (WebAudio — no files needed)
   ============================================================ */
let audioCtx = null;
function initAudio(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}
function tone(freq, dur, type, vol, delay, atk){
  if (!audioCtx || !soundOn) return;
  try{
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + (atk != null ? atk : 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}
function noiseBurst(dur, vol, freq, delay){
  if (!audioCtx || !soundOn) return;
  try{
    const t0 = audioCtx.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = freq || 1400;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
  } catch(e){}
}
function sfx(name){
  if (!soundOn || !audioCtx) return;
  switch(name){
    case 'play': tone(560, 0.05, 'triangle', 0.035); break;
    case 'click': tone(720, 0.035, 'square', 0.025); break;
    case 'trump': tone(392, 0.09, 'sine', 0.05); tone(523, 0.12, 'sine', 0.05, 0.1); break;
    case 'court': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.13, 'triangle', 0.055, i * 0.1)); break;
    case 'lose': tone(330, 0.14, 'sine', 0.045); tone(247, 0.22, 'sine', 0.045, 0.14); break;
    case 'slam':
      noiseBurst(0.035, 1.5, 4200);          // CHATAAK — patta zameen par takraya (full power)
      tone(190, 0.09, 'triangle', 1.3, 0, 0.002);  // tez thwack
      tone(92, 0.16, 'sine', 1.45, 0.004, 0.003);  // bhari THUD
      tone(52, 0.22, 'sine', 1.2, 0.012, 0.006);   // gehri gunj (chhoti)
      noiseBurst(0.12, 1.0, 900, 0.008);     // ghati/matti ka phattah
      tone(340, 0.045, 'square', 0.7, 0, 0.001);   // slap crack
      break;
  }
}

/* ============================================================
   MATCH / ROUND FLOW
   ============================================================ */
function startMatch(opts){
  if (typeof netIsClient === 'function' && netIsClient()) return;
  GEN++;
  const o = opts || setup;
  setup = {
    names: (o.names || setup.names).map((n, i) => (String(n || '').trim() || ('Player ' + (i + 1)))).slice(0, 4),
    humanSeat: (o.humanSeat != null ? o.humanSeat : setup.humanSeat),
    target: o.target || 7,
    streakMode: 'player'   // lagataar hath sirf ek hi khelari ke — sathi ki jeet par reset
  };
  G = {
    names: setup.names.slice(),
    humanSeat: setup.humanSeat,
    target: setup.target,
    streakMode: setup.streakMode,
    votes: {},
    courts: [0, 0],
    hakim: setup.humanSeat,
    nextHakim: null,
    phase: 'idle',
    paused: false,
    busy: false,
    tricks: [0, 0],
    hands: [[], [], [], []],
    deck: [],
    trump: null,
    trick: [],
    turn: null,
    winnerSeat: null,
    roundTeam: null,
    roundKot: false,
    roundGain: 0,
    matchOver: false,
    matchWinner: null,
    reveal: [],
    roundPeace: false,
    peaceWinner: null,
    forcedWin: null,
    roundForced: false,
    kotCall: null,
    peaceCall: null,
    chakkaCall: null,
    resolveKind: null
  };
  stats.matches++;
  closeModal();
  startRound();
}

const DEAL_MS = 85;   // ek patta dene ka waqt (SPEED se scale hota hai)

function startRound(){
  GEN++;
  stats.rounds++;
  stats.hakimLog.push({ hakim: G.hakim, matches: stats.matches });
  G.phase = 'dealing';
  G.paused = false;
  G.busy = true;
  G.hands = [[], [], [], []];
  G.deck = shuffle(makeDeck());
  G.tricks = [0, 0];          // uthai hui (collected) baaziyan
  G.center = [];              // beech ka pile: [{winner, cards:[...4]}]
  G.streak = { seat: null, count: 0 };   // lagataar kis khelari ke
  G.pairMode = false;         // pehli collection ke baad 2-2 mode
  G.plays = 0;                // is deal me kitni baazi kheli gayi
  G.lastTrickWinner = null;
  G.trump = null;
  G.trick = [];
  G.turn = null;
  G.winnerSeat = null;
  G.roundTeam = null;
  G.roundKot = false;
  G.roundGain = 0;
  G.roundLastTake = 0;
  G.reveal = [];
  G.roundPeace = false;
  G.peaceWinner = null;
  G.forcedWin = null;
  G.roundForced = false;
  G.kotCall = null;        // {team, at}
  G.peaceCall = null;      // {team, at}
  G.khowasha = null;       // Khowasha (aap): 'sahi' | 'ghalat' | null
  G.khowashaPartner = null; // Khowasha (saathi)
  G.khowashaFor = null;    // 'kot' | 'peace' | 'chakka'
  G.chakkaCall = null;     // {team, by, status}
  G.resolveKind = null;    // natija kis wajah se aaya
  G.nextHakim = null;
  // TEEN HAAth: pehla haath 5 patte, phir 4, phir 4 — ek ek patta baanta jata hai
  G.schedule = [];
  [5, 4, 4].forEach((n, batch) => {
    for (let r = 0; r < n; r++){
      for (let off = 1; off <= 4; off++){
        G.schedule.push({ seat: (G.hakim + off) % 4, batch });   // ulti garhi: daayen se shuru
      }
    }
  });
  G.si = 0;
  G.haath = 1;
  render();
  later(240, dealTick);
}

function dealTick(){
  if (!G || G.phase !== 'dealing') return;
  if (G.paused){ later(180, dealTick); return; }
  if (!G.trump && G.si >= 20){ askTrump(); return; }
  if (G.si >= G.schedule.length){ finishDeal(); return; }
  const step = G.schedule[G.si];
  G.hands[step.seat].push(G.deck.pop());
  G.haath = step.batch + 1;
  G.si++;
  render();
  later(DEAL_MS, dealTick);
}

function askTrump(){
  if (!G || G.phase !== 'dealing') return;
  G.phase = 'trump';
  render();
  if (G.hakim === G.humanSeat){
    if (window.__CP_AUTO_HUMAN){
      later(40, () => { if (G && G.phase === 'trump') applyTrump(aiPickTrump(G.humanSeat)); });
    } else {
      openTrumpModal();      // 5 patte + Hokm ke options
    }
  } else if (typeof netOnline === 'function' && netOnline()){
    if (typeof netUi === 'function') netUi('askTrump');   // remote hakim khelega
  } else {
    later(1000, () => {
      if (!G || G.phase !== 'trump') return;
      applyTrump(aiPickTrump(G.hakim));
    });
  }
}

function applyTrump(suit){
  if (typeof netAct === 'function' && netAct({ t: 'trump', suit })) return;
  if (!G || G.phase !== 'trump') return;
  if (G.trick.length) return;
  G.trump = suit;
  closeModal();
  const who = G.hakim === G.humanSeat ? 'Aap' : G.names[G.hakim];
  toast(who + ' ne Rang ' + SUIT_CH[suit] + ' ' + SNAME[suit] + ' chuna');
  sfx('trump');

  // CHAKKA: agar Hakim ke paas rang ka A he to deal rok kar chakka poochho
  const hasAce = (G.hands[G.hakim] || []).some(c => c.s === suit && c.r === 'A');
  if (hasAce){
    G.phase = 'chakka';
    G.chakkaCall = null;
    render();
    if (G.hakim === G.humanSeat){
      if (window.__CP_AUTO_HUMAN) later(40, () => { if (G && G.phase === 'chakka') pressChakka(); });
      else openChakkaOfferModal();      // 5 patte + CHAKKA batan
    } else if (typeof netOnline === 'function' && netOnline()){
      if (typeof netUi === 'function') netUi('chakkaOffer');   // remote hakim sochega
    } else {
      later(900, aiChakkaOffer);
    }
    return;
  }
  continueDealAfterTrump();
}

function continueDealAfterTrump(){
  if (!G) return;
  if (G.chakkaCall && G.chakkaCall.status === 'pending') return;   // jawab abhi baqi he
  // baqi do haath (4 + 4) khelte hue baant kar poore 13 patte
  G.phase = 'dealing';
  G.haath = 2;
  render();
  later(320, dealTick);
}

function pressChakka(){

  G.chakkaCall = { team: teamOf(G.hakim), by: G.hakim, status: 'pending' };

  const oppTeam = 1 - G.chakkaCall.team;
  if (typeof netOnline === 'function' && netOnline()){

  }

function partnerSeatOf(seat){ return (seat + 2) % 4; }

function handStrength(seat){
  const hand = (G.hands && G.hands[seat]) || [];
  let score = 0;
  for (const c of hand){
    if (G.trump && c.s === G.trump) score += 2;
    if (c.r === 'A') score += 3; else if (c.r === 'K') score += 2; else if (c.r === 'Q') score += 1;
  }
  return score;
}
function aiKhowashaVote(seat){
  // voter ka andaza (apne haath se): mazboot haath -> "sahi", kamzor -> mix
  const st = (seat == null) ? partnerSeatOf(G.humanSeat) : seat;
  const score = handStrength(st);
  const p = Math.max(0.15, Math.min(0.85, score / 18));
  return Math.random() < p ? 'sahi' : 'ghalat';
}

/* dono ka khowasha mil kar button ka faisla karte hain:

function aiChakkaResponse(){
  if (!G || !G.chakkaCall || G.chakkaCall.status !== 'pending') return;
  const oppTeam = 1 - G.chakkaCall.team;
  const oppSeats = [0,1,2,3].filter(x => teamOf(x) === oppTeam);
  const trumps = oppSeats.reduce((a, seat) =>
    a + (G.hands[seat] || []).filter(c => c.s === G.trump).length, 0);
  // agar doosri team ke paas trump na hone ke barabar hon to chakka maan lo

  resolveChakka(accept);
}

function resolveChakka(accepted){
  if (!G || !G.chakkaCall) return;
  if (typeof netUi === 'function') netUi('shadow', { fn: 'resolveChakka', args: [!!accepted] });
  closeModal();
  if (accepted){
    G.chakkaCall.status = 'accepted';
    G.paused = false;
    G.forcedWin = { team: G.chakkaCall.team, kot: false, chakka: true, keepHakim: true };
    render();
    endRound();
    return;
  }
  // "Chakka Nahi He" — khel shuru, chakka record rahega
  G.chakkaCall.status = 'denied';
  render();
  toast('"Chakka Nahi He" — khel shuru!');
  later(420, continueDealAfterTrump);
}

function finishDeal(){
  G.phase = 'playing';
  G.turn = G.hakim;
  G.busy = false;
  render();
  later(340, drive);
}

/* ---------- trump AI / suggestion ---------- */
function trumpScores(seat){
  const hand = G.hands[seat] || [];
  const out = {};
  for (const s of SUIT_ORDER){
    const cs = hand.filter(c => c.s === s);
    out[s] = cs.length * 3 + cs.reduce((a, c) => a + (c.r === 'A' ? 3 : c.r === 'K' ? 2 : c.r === 'Q' ? 1.2 : c.r === 'J' ? 0.8 : 0), 0);
  }
  return out;
}
function bestTrumpFor(seat){
  const sc = trumpScores(seat);
  return SUIT_ORDER.reduce((a, b) => sc[b] > sc[a] ? b : a);
}
function aiPickTrump(seat){
  const sc = trumpScores(seat);
  let best = SUIT_ORDER[0], bv = -1;
  for (const s of SUIT_ORDER){
    const v = sc[s] + Math.random() * 0.8;
    if (v > bv){ bv = v; best = s; }
  }
  return best;
}

/* ============================================================
   TURNS & TRICKS
   ============================================================ */
function legalFromHand(hand, trick){
  if (!trick.length) return hand.slice();
  const led = trick[0].card.s;
  const same = hand.filter(c => c.s === led);
  return same.length ? same : hand.slice();
}
function legalCards(seat){ return legalFromHand(G.hands[seat], G.trick); }

function beats(card, bestCard, led, trump){
  if (card.s === bestCard.s) return RV[card.r] > RV[bestCard.r];
  if (card.s === trump) return true;
  if (bestCard.s === trump) return false;
  return card.s === led;
}
function bestOfTrick(trick, trump){
  const led = trick[0].card.s;
  let best = trick[0];
  for (let i = 1; i < trick.length; i++){
    if (beats(trick[i].card, best.card, led, trump)) best = trick[i];
  }
  return best;
}
function trickWinner(){ return bestOfTrick(G.trick, G.trump); }

function drive(){
  if (!G || G.phase !== 'playing' || G.paused) return;
  if (typeof netIsClient === 'function' && netIsClient()){ render(); return; }
  if (window.__CP_MANUAL){ render(); return; }   // test/debug: koi khud na chale
  if (G.busy) return;
  if (G.turn == null) return;
  if (typeof netOnline === 'function' && netOnline() && G.turn !== G.humanSeat){
    render(); return;                            // remote insaan — network se aayega
  }
  if (G.turn === G.humanSeat){
    if (window.__CP_AUTO_HUMAN){
      G.busy = true;
      render();
      later(40, () => {
        if (!G || G.phase !== 'playing' || !G.busy) return;
        G.busy = false;
        const legal = legalCards(G.humanSeat);
        if (!legal.length) return;
        doPlay(G.humanSeat, legal[Math.floor(Math.random() * legal.length)]);
      });
      return;
    }
    render();
    return;
  }
  const seat = G.turn;
  if (aiMaybeCall(seat)) return;   // AI ne challenge kiya — jawab ka intezar
  G.busy = true;
  render();
  later(750, () => {
    if (!G || G.phase !== 'playing') return;
    G.busy = false;
    const card = aiChoose(seat);
    if (card) doPlay(seat, card);
  });
}

function doPlay(seat, card){
  if (!G || G.phase !== 'playing' || G.paused || G.busy) return;
  if (G.turn !== seat || !card) return;
  const legal = legalCards(seat);
  if (!legal.some(c => c.id === card.id)) return;
  const hand = G.hands[seat];
  const idx = hand.findIndex(c => c.id === card.id);
  if (idx < 0) return;

  hand.splice(idx, 1);
  G.trick.push({seat, card});
  G.busy = true;
  sfx('play');

  if (G.trick.length === 4){
    render();
    later(820, resolveTrick);
  } else {
    G.turn = (seat + 1) % 4;   // ulti garhi: neeche -> daayen (counter-clockwise)
    render();
    later(520, () => {
      if (!G || G.phase !== 'playing') return;
      G.busy = false;
      render();
      drive();
    });
  }
}

function needStreak(){ return G.pairMode ? 2 : 3; }

function resolveTrick(){
  if (!G || G.phase !== 'playing' || G.trick.length !== 4) return;
  const winner = trickWinner();
  G.winnerSeat = winner.seat;
  G.lastTrickWinner = winner.seat;
  G.plays++;

  // jeeta hua patta foran count NAHI hota — pehle centre pile me jata hai
  G.center.push({ winner: winner.seat, cards: G.trick.slice() });

  // lagataar jeet — SIRF wahi khelari; sathi ki jeet (upar bara patta) par count toot jata he
  const sKey = (G.streakMode === 'team') ? teamOf(winner.seat) : winner.seat;
  const cKey = (G.streak.seat == null || G.streak.count === 0) ? null
             : ((G.streakMode === 'team') ? teamOf(G.streak.seat) : G.streak.seat);
  if (cKey === sKey) G.streak.count++;
  else { G.streak.seat = winner.seat; G.streak.count = 1; }
  G.streak.seat = winner.seat;

  const need = needStreak();
  let took = 0;
  if (G.streak.count >= need){
    took = G.center.length;
    G.tricks[teamOf(winner.seat)] += took;
    G.center = [];
    G.streak = { seat: null, count: 0 };
    G.pairMode = true;          // ab se "do do hath" ka game
  }
  render();
  if (took){
    const who = winner.seat === G.humanSeat ? 'Aap' : G.names[winner.seat];
    toast(who + ' ne lagataar ' + need + ' hath kar ke ' + took + ' baaziyan utha lin!');
    sfx('court');
  }
  later(took ? 1500 : 1150, () => {
    if (!G || G.phase !== 'playing') return;
    G.trick = [];
    G.winnerSeat = null;
    if (G.plays >= 13){ endRound(); return; }
    G.turn = winner.seat;
    G.busy = false;
    render();
    drive();
  });
}

/* ============================================================
   AI
   ============================================================ */
function aiChoose(seat){
  const legal = legalCards(seat);
  if (!legal.length) return null;
  if (!G.trick.length) return aiLead(seat, legal);
  return aiFollow(seat, legal);
}
function cheapestOf(cards){
  let best = cards[0];
  for (const c of cards) if (RV[c.r] < RV[best.r]) best = c;
  return best;
}
function iAmHot(seat){
  const need = needStreak();
  const mine = (G.streak.seat === seat) ? G.streak.count : 0;
  return mine >= need - 1 || G.plays >= 12;   // ek aur jeet = pile / aakhri hath
}
function oppHot(seat){
  const need = needStreak();
  if (G.streak.seat == null) return false;
  return G.streak.count >= need - 1 && teamOf(G.streak.seat) !== teamOf(seat);
}
function highestOf(cards){
  let best = cards[0];
  for (const c of cards) if (RV[c.r] > RV[best.r]) best = c;
  return best;
}
function aiLead(seat, legal){
  if (iAmHot(seat)){                 // ek aur hath = poora pile — mazboot patta
    const trumps = legal.filter(c => c.s === G.trump);
    return trumps.length ? highestOf(trumps) : highestOf(legal);
  }
  const trumps = legal.filter(c => c.s === G.trump);
  const myTrumps = G.hands[seat].filter(c => c.s === G.trump).length;
  const aceTrump = trumps.find(c => c.r === 'A');
  if (aceTrump && myTrumps >= 3) return aceTrump;
  const nonTrump = legal.filter(c => c.s !== G.trump);
  const pool = (nonTrump.length ? nonTrump : legal).slice();
  const cnt = {};
  G.hands[seat].forEach(c => { cnt[c.s] = (cnt[c.s] || 0) + 1; });
  pool.sort((a, b) => (cnt[b.s] || 0) - (cnt[a.s] || 0) || RV[a.r] - RV[b.r]);
  return pool[0];
}
function aiFollow(seat, legal){
  const led = G.trick[0].card.s;
  const partner = partnerOf(seat);
  const best = bestOfTrick(G.trick, G.trump);
  const partnerWinning = best.seat === partner;
  const urgent = iAmHot(seat) || oppHot(seat);

  if (partnerWinning && !iAmHot(seat)){
    const nonTrump = legal.filter(c => c.s !== G.trump);
    return cheapestOf(nonTrump.length ? nonTrump : legal);
  }
  const winning = legal.filter(c => beats(c, best.card, led, G.trump));
  if (winning.length){
    if (urgent) return highestOf(winning);        // hath pakka karo
    const nonTrump = winning.filter(c => c.s !== G.trump);
    const pool = (nonTrump.length && led !== G.trump) ? nonTrump : winning;
    return cheapestOf(pool);
  }
  const nonTrump = legal.filter(c => c.s !== G.trump);
  return cheapestOf(nonTrump.length ? nonTrump : legal);
}

/* ============================================================
   ROUND / MATCH END
   ============================================================ */
function endRound(){
  if (typeof netIsClient === 'function' && netIsClient()) return;
  if (!G || G.phase === 'roundEnd') return;
  const forced = G.forcedWin;
  // aakhri baazi jeetne wala baqi saara centre pile utha leta hai
  let lastTake = 0;
  if (!forced && !G.roundPeace && G.center.length && G.lastTrickWinner != null){
    lastTake = G.center.length;
    G.tricks[teamOf(G.lastTrickWinner)] += lastTake;
    G.center = [];
  }
  if (G.roundPeace || forced){ G.center = []; G.trick = []; }
  if (forced && !forced.chakka){ G.tricks = forced.team === 0 ? [13, 0] : [0, 13]; }

  // ---------- nateeja: challenge (KOT / PEACE) ke sath ----------
  const kc = G.kotCall, pc = G.peaceCall;
  let wt, kot = false, gain = 1, kind = 'normal';

  if (forced && forced.chakka){
    // "Han Chakka He" -> chakka bolne wali team ko 2 points, deal dobara
    wt = forced.team; kot = false; gain = 2; kind = 'chakkaAccepted';
  } else if (G.chakkaCall && G.chakkaCall.status === 'denied'){
    // Chakka deny hua — phir KOT hua?
    const chTeam = G.chakkaCall.team, chOpp = 1 - chTeam;
    if (G.tricks[chOpp] === 0){
      // chakka wali team ne KOT kar diya -> 3 points
      wt = chTeam; kot = true; gain = 3; kind = 'chakkaKot';
    } else if (G.tricks[chTeam] === 0){
      // rang banane wali (chakka) team hi KOT ho gayi -> doosri team ko 4 points
      wt = chOpp; kot = true; gain = 4; kind = 'chakkaKotAgainst';
    } else if (forced){
      wt = forced.team; kot = true; gain = 1; kind = 'kotAccepted';
    } else if (kc){
      const oppTeam = 1 - kc.team;
      if (G.tricks[oppTeam] === 0){ wt = kc.team; kot = true; gain = 2; kind = 'kotProven'; }
      else if (G.tricks[oppTeam] >= 3){ wt = oppTeam; kot = false; gain = 1; kind = 'kotFailed'; if (G.tricks[kc.team] === 0 && kc.team === teamOf(G.hakim)){ gain = 3; kind = 'kotFailedSwept'; } }
      else { wt = (G.tricks[0] > G.tricks[1] ? 0 : 1); kot = (G.tricks[1-wt]===0); gain = 1; kind = 'kotFailedSmall'; }
    } else if (pc){
      const callerTeam = pc.team, deniers = 1 - callerTeam;
      if (G.tricks[deniers] < 7){ wt = callerTeam; gain = 1; kind = 'peaceProven'; }
      else if (G.tricks[deniers] <= 12){ wt = deniers; gain = 1; kind = 'peaceFailed'; }
      else if (callerTeam === teamOf(G.hakim)){ wt = deniers; kot = true; gain = 3; kind = 'peaceKotVsRang'; }
      else { wt = deniers; kot = true; gain = 2; kind = 'peaceKotByRang'; }
    } else if (G.roundPeace){
      wt = null; gain = 0; kind = 'peaceAccepted';
    } else {
      wt = (G.tricks[0] > G.tricks[1] ? 0 : 1);
      kot = (G.tricks[1 - wt] === 0);
      gain = 1; kind = kot ? 'naturalKot' : 'normal'; if (kot && (1 - wt) === teamOf(G.hakim)){ gain = 2; kind = 'naturalKotRang'; }
    }
  } else if (forced){
    // doosri team ne "Han KOT" maan liya -> kot bolne wali team ko sirf 1 point
    wt = forced.team; kot = true; gain = 1; kind = 'kotAccepted';
  } else if (kc){
    const oppTeam = 1 - kc.team;
    if (G.tricks[oppTeam] === 0){
      // call sahi sabit hui — KOT hua
      wt = kc.team; kot = true; gain = 2; kind = 'kotProven';
    } else if (G.tricks[oppTeam] >= 3){
      // call ghalat — jinhone "KOT Nahi Hai" kaha unhe 1 point
      wt = oppTeam; kot = false; gain = 1; kind = 'kotFailed';
      if (G.tricks[kc.team] === 0 && kc.team === teamOf(G.hakim)){
        gain = 3; kind = 'kotFailedSwept';   // R2: Rang team ne KOT kaha, deny, khud KOT -> 3
      }
    } else {
      wt = (G.tricks[0] > G.tricks[1] ? 0 : 1);
      kot = (G.tricks[1 - wt] === 0);
      gain = 1; kind = 'kotFailedSmall';
    }
  } else if (pc){
    // "PEACE Nahi Hai" — khel jari raha
    const callerTeam = pc.team;
    const deniers = 1 - callerTeam;
    if (G.tricks[deniers] < 7){
      // unhon ne 7 se kam hath utaye — 1 point PEACE bolne wali team ko
      wt = callerTeam; gain = 1; kind = 'peaceProven';
    } else if (G.tricks[deniers] <= 12){
      // "PEACE Nahi Hai" walon ne 7+ hath utaaye — unhe 1 point
      wt = deniers; gain = 1; kind = 'peaceFailed';
    } else {
      // deniers ne poore 13 uthaaye — PEACE bolne wali team KOT ho gayi
      kot = true; wt = deniers;
      if (callerTeam === teamOf(G.hakim)){
        gain = 3; kind = 'peaceKotVsRang';   // rang team (caller) KOT hui -> deniers ko 3
      } else {
        gain = 2; kind = 'peaceKotByRang';   // rang team (deniers) ne 13 uthaaye -> rang ko 2
      }
    }
  } else if (G.roundPeace){
    // doosri team ne "Han PEACE" maan liya — kisi ko point nahi
    wt = null; gain = 0; kind = 'peaceAccepted';
  } else {
    wt = (G.tricks[0] > G.tricks[1] ? 0 : 1);
    kot = (G.tricks[1 - wt] === 0);
    gain = 1;                         // bina KOT call ke sweep = sirf 1 point
    kind = kot ? 'naturalKot' : 'normal';
    if (kot && (1 - wt) === teamOf(G.hakim)){
      gain = 2; kind = 'naturalKotRang';    // R1: Rang team hi KOT ho gayi -> 2 points
    }
  }

  const noPoint = (wt == null);
  const lt = noPoint ? null : 1 - wt;
  G.phase = 'roundEnd';
  G.busy = true;
  if (!noPoint) G.courts[wt] += gain;
  G.roundTeam = wt;
  G.roundKot = kot;
  G.roundGain = gain;
  G.resolveKind = kind;
  const hakimTeam = teamOf(G.hakim);
  // NAYA RULE — challenge NAKAM (claim fail): caller ki team ke HATH dekho (7 threshold)
  //   caller team < 7  -> caller ke BAD wale ko deal (wo Rang banayega)
  //   opponents < 7    -> jis ne pehle rang banaya tha, wahi hakim
  let failCaller = null;
  if (kind === 'kotFailed' || kind === 'kotFailedSmall' || kind === 'kotFailedSwept') failCaller = (kc && kc.caller != null) ? kc.caller : null;
  else if (kind === 'peaceFailed' || kind === 'peaceKotVsRang' || kind === 'peaceKotByRang') failCaller = (pc && pc.caller != null) ? pc.caller : null;
  else if (kind === 'chakkaKotAgainst') failCaller = G.hakim;
  else if (G.chakkaCall && G.chakkaCall.status === 'denied' && (kind === 'normal' || kind === 'naturalKot')) failCaller = G.hakim;
  let retained, hakimBase;
  if (failCaller != null){
    retained = G.tricks[teamOf(failCaller)] >= 7;
    hakimBase = failCaller;
  } else {
    retained = noPoint ? true : ((forced && forced.keepHakim) ? true : (wt === hakimTeam));
    hakimBase = G.hakim;
  }
  G.nextHakim = retained ? G.hakim : (hakimBase + 1) % 4;   // ulti garhi: caller/hakim ke daayen wala
  G.roundFailCaller = failCaller;
  G.roundForced = !!forced;
  G.matchOver = noPoint ? false : (G.courts[wt] >= G.target);
  G.matchWinner = G.matchOver ? wt : null;
  stats.results.push({
    winnerTeam: wt,
    tricks: G.tricks.slice(),
    courts: G.courts.slice(),
    kot,
    gain,
    kind,
    peace: !!G.roundPeace,
    forced: !!forced,
    kotCall: !!kc,
    peaceCall: !!pc,
    hakim: G.hakim,
    nextHakim: G.nextHakim,
    failCaller: G.roundFailCaller,
    retained
  });
  render();
  sfx(noPoint ? 'lose' : (wt === teamOf(G.humanSeat) ? 'court' : 'lose'));
  later(750, () => {
    if (!G) return;
    if (typeof netUi === 'function') netUi('roundModal', { retained: !!retained, matchOver: !!G.matchOver });
    if (G.matchOver) openMatchModal(retained);
    else openRoundModal(retained);
  });
}

function nextRound(){
  if (typeof netAct === 'function' && netAct({ t: 'next' })) return;
  if (!G || G.nextHakim == null) return;
  G.hakim = G.nextHakim;
  startRound();
}

/* ---------- SLAM: patta zameen par maarna (icon) ---------- */
let slamArmed = false;
function beatsCard(x, c, trump){
  // kya patta x, patte c ko hara sakta he? (trick power: trump sab par bhari, warna suit+rank)
  if (x.s === trump && c.s !== trump) return true;
  if (x.s !== trump && c.s === trump) return false;
  if (x.s === c.s) return RV[x.r] > RV[c.r];
  return false;
}
function canSlam(card){
  // SLAM = "mera patta YE HATH pakka jeet raha he" — har haal me, har LEGAL jawab par
  //  (a) aakhri (4th) patta jo in-4 me sabse bara ho -> chota absolute bhi OK
  //  (b) dead discard ya maidan me koi aisa patta jo ise hara de -> NAHI
  //  (c) beech ka: kisi or ke paas aisa LEGAL patta jo ise hara de -> NAHI
  //      (suit follow ki majboori me phansa "beater" — jo wo khel hi nahi sakta — beater NAHI)
  //  (d) sab se uper (koi bhi ise legally na hara sake) -> SLAM
  if (!G || !card) return false;
  const t = G.trick || [];
  const trump = G.trump;
  const me = G.humanSeat;
  const played = {};
  t.forEach(pr => { played[pr.seat] = 1; });
  // meri chal ke baad jo baqi khelenge (turn order me)
  const after = [];
  for (let i = 1; i <= 3; i++){
    const st = (me + i) % 4;
    if (st !== me && !played[st]) after.push(st);
  }
  const led = t.length ? t[0].card.s : card.s;
  // follow suit: led suit haath me ho to wahi khelna hoga, warna koi bhi
  const legalOf = (st) => {
    const h = G.hands[st] || [];
    const f = h.filter(c => c.s === led);
    return f.length ? f : h;
  };
  const winnerSeat = (cards) => {
    let w = cards[0];
    for (let i = 1; i < cards.length; i++){
      if (beatsCard(cards[i].card, w.card, trump)) w = cards[i];
    }
    return w.seat;
  };
  // har LEGAL combination par mera patta hi hath uthaye — tabhi SLAM
  const rec = (cards, depth) => {
    if (depth === after.length) return winnerSeat(cards) === me;
    const st = after[depth];
    const opts = legalOf(st);
    if (!opts.length) return rec(cards, depth + 1);
    for (const c of opts){
      if (!rec(cards.concat([{ seat: st, card: c }]), depth + 1)) return false;
    }
    return true;
  };
  return rec(t.map(pr => ({ seat: pr.seat, card: pr.card })).concat([{ seat: me, card: card }]), 0);
}
function toggleSlam(){
  slamArmed = !slamArmed;
  render();
}
function dustAt(el){
  if (!el || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height * 0.92;
  for (let i = 0; i < 14; i++){
    const d = document.createElement('div');
    d.className = 'dust';
    const ang = (-90 + (Math.random() * 90 - 45)) * Math.PI / 180;
    const dist = 22 + Math.random() * 58;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    d.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    d.style.setProperty('--s', (0.7 + Math.random() * 1.2).toFixed(2));
    document.body.appendChild(d);
    setTimeout(() => { try{ d.remove(); }catch(e){} }, 850);
  }
}
function shakeScreen(){
  const el = document.getElementById('app');   // body par transform -> fixed dust paint nahi hoti
  el.classList.remove('screen-shake');
  void el.offsetWidth;
  el.classList.add('screen-shake');
  setTimeout(() => el.classList.remove('screen-shake'), 480);
}
function slotElFor(seat){
  const rel = ((((seat != null ? seat : 0) - (G ? G.humanSeat : 0)) % 4) + 4) % 4;
  return $(rel === 0 ? 'slotBottom' : rel === 1 ? 'slotRight' : rel === 2 ? 'slotTop' : 'slotLeft');
}
function slamFxAt(seat){
  const slot = slotElFor(seat);
  if (slot){
    slot.classList.remove('slam');
    void slot.offsetWidth;
    slot.classList.add('slam');
    setTimeout(() => slot.classList.remove('slam'), 700);
  }
  sfx('slam');
  dustAt(slot);
  shakeScreen();
}
function slamPlay(c){
  slamFxAt(G.humanSeat);
  doPlay(G.humanSeat, c);
  if (typeof netUi === 'function') netUi('slamFx', { seat: G.humanSeat });
}
function renderHand(){
  const handEl = $('hand');
  if (!handEl) return;
  const raw = G.hands[G.humanSeat] || [];
  // jab tak Hokm nahi chuna, ghair-hakim apne patte nahi dekhte
  const hidden = !G.trump && (G.phase === 'dealing' || G.phase === 'trump') && G.hakim !== G.humanSeat;
  const cards = G.trump ? sortHand(raw, G.trump) : raw.slice();
  const canPlay = G.phase === 'playing' && G.turn === G.humanSeat && !G.busy && !G.paused;
  const legalIds = canPlay ? new Set(legalCards(G.humanSeat).map(c => c.id)) : null;
  handEl.innerHTML = cards.map(c => hidden ? cardBackHTML() : cardHTML(c, {
    play: !!(legalIds && legalIds.has(c.id)),
    dim: !!(legalIds && !legalIds.has(c.id))
  })).join('');
  if (legalIds){
    handEl.querySelectorAll('.card.play').forEach(nd => {
      nd.addEventListener('click', () => {
        if (!G) return;
        const c = G.hands[G.humanSeat].find(x => x.id === nd.dataset.id);
        if (!c) return;
        if (slamArmed){
          slamArmed = false;
          if (canSlam(c)){
            if (typeof netIsClient === 'function' && netIsClient()){
              slamFxAt(G.humanSeat);
              netSend({ t: 'act', m: { t: 'play', id: c.id, slam: true } });
              render();
              return;
            }
            slamPlay(c); return;
          }
        }
        if (typeof netAct === 'function' && netAct({ t: 'play', id: c.id })) return;
        sfx('click'); doPlay(G.humanSeat, c);
      });
    });
  }
  handEl.classList.toggle('myturn', !!legalIds);
}

function runAiResponse(kind){
  // maqabil team KHUD: unke khowasha votes -> mapping (dono ghalat -> Han | dono sahi -> Nahi)
  // 1-1 split -> mazbooti: mazboot haath -> challenge (Nahi), kamzor -> maan lo (Han)
  const g = GEN;
  const seats = opponentSeats();
  const votes = [null, null];
  const setMark = (i, v) => {
    votes[i] = v;
    // unka khowasha UNHE hi — caller ke screen par koi mark nahi
    G.khowasha = votes[0]; G.khowashaPartner = votes[1];
  };
  const decide = () => {
    let yes;
    if (votes[0] && votes[1] && votes[0] === votes[1]) yes = votes[0] === 'ghalat';
    else yes = (handStrength(seats[0]) + handStrength(seats[1])) < 18;   // 1-1: maqabil khud
    const label = kind === 'peace' ? (yes ? 'Han PEACE' : 'PEACE Nahi Hai') : (yes ? 'Han KOT' : 'KOT Nahi Hai');
    const d = $('respDecision');
    if (d){
      const mk = d.querySelector('.kp-mark');
      mk.className = 'kp-mark ' + (yes ? 'sahi' : 'ghalat');
      mk.textContent = '"' + label + '"';
    }
    toast(teamName(1 - teamOf(G.humanSeat)) + ' ka faisla — ' + label);
    sfx('click');
    setTimeout(() => {
      if (g !== GEN || !G) return;
      if (kind === 'peace'){ if (yes) peaceAccepted(); else peaceDenied(); }
      else { if (yes) kotAccepted(); else kotDenied(); }
    }, Math.max(60, 1200 * SPEED));
  };
  setTimeout(() => { if (g !== GEN || !G) return; setMark(0, aiKhowashaVote(seats[0])); }, Math.max(40, 550 * SPEED));
  setTimeout(() => { if (g !== GEN || !G) return; setMark(1, aiKhowashaVote(seats[1])); decide(); }, Math.max(90, 1150 * SPEED));
}
function teamStrength(team){ return handStrength(team) + handStrength(team + 2); }

  // JAWAB aap + aapke saathi ka — khowasha + Han/Nahi (chakka jaisa hi pattern)
  G.khowasha = null;
  G.khowashaPartner = (typeof netOnline === 'function' && netOnline()) ? (G.khowashaPartner || null) : aiKhowashaVote();
  G.khowashaFor = kind;
  const yesLbl = kind === 'peace' ? 'Han PEACE' : 'Han KOT';
  const noLbl = kind === 'peace' ? 'PEACE Nahi Hai' : 'KOT Nahi Hai';
  const yesId = kind === 'peace' ? 'btnPeaceYes' : 'btnKotYes';

function aiMaybeCall(seat){
  // AI khilaf-walon ka challenge: zabardast haath -> KOT; insaan team kamzor -> PEACE
  if (!G || window.__CP_AUTO_HUMAN) return false;
  if (seat == null || seat === G.humanSeat || !canCallNow()) return false;
  const aiTeam = teamOf(seat), huTeam = 1 - aiTeam;
  const aiS = teamStrength(aiTeam), huS = teamStrength(huTeam);
  if (G.tricks[huTeam] === 0 && aiS >= 34){ callKot(aiTeam, seat); return true; }
  if (aiS >= 23 && huS <= 18 && (G.center.length || 0) >= 1){ callPeace(aiTeam, seat); return true; }
  return false;
}

function callKot(byTeam, bySeat){
  if (byTeam == null && typeof netAct === 'function' && netAct({ t: 'call', what: 'kot' })) return;
  if (!canCallNow()) return;
  const callerTeam = (byTeam == null) ? teamOf(G.humanSeat) : byTeam;
  G.callTeam = callerTeam;
  G.callSeat = (bySeat != null) ? bySeat : (callerTeam === teamOf(G.humanSeat) ? G.humanSeat : opponentSeats()[0]);

}

function kotDenied(tOverride){

    '</div>',
    'w-reveal'
  );

  const gRev = GEN;

    sfx('click');
    closeModal();

      netSend({ t: 'act', m: { t: 'revealDone' } });

    }
    if (typeof netUi === 'function') netUi('revealClose');
    if (G){ G.reveal = []; G.revealTeam = null; G.paused = false; render(); drive(); }
  };
  const tick = setInterval(() => {
    if (gRev !== GEN){ clearInterval(tick); return; }

  });

/* ---------- confetti ---------- */
function confetti(){
  const colors = ['#e7c568','#f3e3ac','#ffffff','#9fd4bb','#b3261e','#e05a4e'];
  for (let i = 0; i < 46; i++){
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    const dur = 2.2 + Math.random() * 2;
    d.style.animationDuration = dur + 's';
    d.style.animationDelay = (Math.random() * 0.7) + 's';
    d.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    d.style.opacity = 0.9;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), (dur + 1) * 1000);
  }
}

/* ============================================================
   ONLINE MULTIPLAYER — host-authoritative + room relay
   (host = room banane wala; server sirf messages aage bhejta he)
   ============================================================ */
const NET = { on: false, host: false, ws: null, seat: null, room: null, names: [null, null, null, null], url: '' };

function netOnline(){ return NET.on; }
function netIsHost(){ return NET.on && NET.host; }
function netIsClient(){ return NET.on && !NET.host; }

function netSend(obj){
  if (!NET.ws || NET.ws.readyState !== 1) return;
  try { NET.ws.send(JSON.stringify(obj)); } catch(e){}
}
function netAct(a){
  if (!netIsClient()) return false;
  netSend({ t: 'act', m: a });
  return true;
}
function netUi(name, data){
  if (!netIsHost()) return;
  netSend({ t: 'msg', m: { t: 'ui', name, data: (data == null ? null : data) } });
}

/* host ka G -> har khiladi ke liye sirf APNA haath, baaki chhupe */
function viewFor(seat){
  const v = {};
  for (const k in G){
    if (k === 'hands' || k === 'deck' || k === 'schedule') continue;
    v[k] = G[k];
  }
  v.hands = G.hands.map((h, i) => {
    if (i === seat) return h.slice();
    if (G.revealTeam != null && teamOf(seat) === G.revealTeam && i === partnerSeatOf(seat)) return h.slice();
    return h.map(() => ({ hidden: true }));
  });
  v.deck = [];
  v.humanSeat = seat;
  const votes = G.votes || {};
  v.khowasha = (votes[seat] != null) ? votes[seat] : null;
  v.khowashaPartner = (votes[partnerSeatOf(seat)] != null) ? votes[partnerSeatOf(seat)] : null;
  return v;
}
function netBroadcast(){
  if (!netIsHost() || !G) return;
  for (let s = 0; s < 4; s++){
    if (s === G.humanSeat) continue;
    netSend({ t: 'msg', m: { t: 'st', to: s, view: viewFor(s) } });
  }
}
function khowashaRefresh(){
  const wrap = $('khowashaPartner');
  if (wrap){
    const old = wrap.querySelector('.kp-mark');
    if (old) old.outerHTML = khowashaMarkHTML(G.khowashaPartner, 'kp-live');
  }
  evaluateKhowasha();
}
function netApplyView(view){
  if (!view) return;
  G = view;
  render();
  khowashaRefresh();
}
function netShadow(fn, args){
  const map = { kotAccepted: kotAccepted, kotDenied: kotDenied, peaceAccepted: peaceAccepted, peaceDenied: peaceDenied, resolveChakka: resolveChakka };
  const f = map[fn];
  if (f) f.apply(null, args || []);
}
function netUiApply(name, data){
  if (!G) return;
  switch (name){
    case 'askTrump':
      if (G.phase === 'trump' && G.hakim === G.humanSeat && !G.trump) openTrumpModal();
      break;
    case 'chakkaOffer':
      if (G.hakim === G.humanSeat && !G.chakkaCall) openChakkaOfferModal();
      break;
    case 'chakkaResponse':
      if (G.chakkaCall && teamOf(G.humanSeat) !== G.chakkaCall.team) openChakkaResponseModal();
      break;
    case 'callUI':
      if (data) openCallUIFor(data.kind, data.callerTeam);
      break;
    case 'shadow':
      if (data) netShadow(data.fn, data.args);
      break;
    case 'roundModal':
      if ((data && data.matchOver) || G.matchOver) openMatchModal(data ? data.retained : false);
      else openRoundModal(data ? data.retained : false);
      break;
    case 'revealClose':
      closeModal();
      break;
    case 'slamFx':
      if (data && data.seat !== G.humanSeat) slamFxAt(data.seat);
      break;
  }
}

/* host par: khiladi ka action mila — engine me lagao */
function netOnAct(m, from){
  if (!netIsHost() || !G || !m) return;
  const seat = (from != null) ? from : G.humanSeat;
  switch (m.t){
    case 'play': {
      const c = (G.hands[seat] || []).find(x => x.id === m.id);
      if (!c) return;
      if (m.slam){
        slamFxAt(seat);
        netUi('slamFx', { seat });
      }
      doPlay(seat, c);
      break;
    }
    case 'trump': applyTrump(m.suit); break;
    case 'chakkaPress': pressChakka(); break;
    case 'chakkaSkip': continueDealAfterTrump(); break;
    case 'chakkaAnswer': resolveChakka(!!m.v); break;
    case 'call':
      if (m.what === 'peace') callPeace(teamOf(seat), seat);
      else callKot(teamOf(seat), seat);
      break;
    case 'answer':
      if (m.what === 'peace'){ if (m.v) peaceAccepted(); else peaceDenied(); }
      else { if (m.v) kotAccepted(); else kotDenied(); }
      break;
    case 'khowasha':
      if (!G.votes) G.votes = {};
      G.votes[seat] = (m.v === 'sahi' || m.v === 'ghalat') ? m.v : null;
      if (seat === partnerSeatOf(G.humanSeat)) G.khowashaPartner = G.votes[seat];
      render();
      khowashaRefresh();
      break;
    case 'next': nextRound(); break;
    case 'rematch': startMatch(setup); break;
    case 'revealDone':
      netUi('revealClose');
      G.reveal = []; G.revealTeam = null; G.paused = false; render(); drive();
      break;
  }
}

/* ---------- server connection + lobby ---------- */
function netWsUrl(){
  const inp = $('netUrl');
  let u = (inp && inp.value.trim()) || NET.url || '';
  if (!u && (location.protocol === 'http:' || location.protocol === 'https:')){
    u = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  }
  return u;
}
function netConnect(url, onOpen){
  if (!url){ toast('Server URL daalein (README-ONLINE.md dekhein)'); return; }
  NET.url = url;
  try{
    const ws = new WebSocket(url);
    NET.ws = ws;
    ws.onopen = () => { if (onOpen) onOpen(); };
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch(err){ return; }
      netOnMessage(msg);
    };
    ws.onclose = () => {
      if (NET.on){ toast('Server se connection toot gaya'); }
      NET.on = false; NET.ws = null;
    };
  } catch(err){ toast('Server se jud nahi sake'); }
}
function netOnMessage(msg){
  if (!msg) return;
  switch (msg.t){
    case 'welcome':
      NET.seat = msg.seat; NET.room = msg.room; NET.names = msg.names || NET.names; NET.host = (msg.seat === 0);
      openLobby();
      break;
    case 'lobby':
      NET.names = msg.names || NET.names;
      if (!NET.on) openLobby();
      break;
    case 'go':
      NET.on = true; NET.host = (NET.seat === 0);
      closeModal();
      if (NET.host){
        const names = (msg.names || NET.names).map((x, i) => x || ('Player ' + (i + 1)));
        startMatch({ names, humanSeat: NET.seat, target: 7, streakMode: 'player' });
      } else {
        toast('Khel shuru ho raha he…');
      }
      break;
    case 'st': netApplyView(msg.view); break;
    case 'ui': netUiApply(msg.name, msg.data); break;
    case 'act': netOnAct(msg.m, msg.from); break;
    case 'err': toast(msg.msg || 'Koi masla ho gaya'); break;
    case 'drop':
      toast((NET.names[msg.seat] || 'Ek khiladi') + ' khel chhod kar gaya');
      break;
    case 'roomgone':
      toast('Room band — host chala gaya');
      NET.on = false;
      break;
  }
}
function openOnlinePanel(){
  GEN++;
  if (G) G.paused = true;
  closeModal();
  openOverlay(
    '<div class="modal-head">Doston ke sath Online</div>' +
    '<p class="sub">Ek banda <b>room banayega</b> (host), baaki <b>code</b> se judenge.<br>Sab ke sab asli khiladi — koi AI nahi.</p>' +
    '<label class="id-field"><span>Aap ka naam</span><input id="netName" maxlength="12" autocomplete="off" value="Khiladi"></label>' +
    '<label class="id-field"><span>Server URL (agar file:// se khel rahe hon)</span><input id="netUrl" autocomplete="off" spellcheck="false" placeholder="wss://aapka-server.com"></label>' +
    '<div class="modal-actions" style="flex-direction:column;gap:9px">' +
      '<button class="btn-primary" id="btnNetCreate">Naya Room Banayein (main host)</button>' +
      '<div style="display:flex;gap:8px;width:100%">' +
        '<input id="netCode" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE" style="flex:1;text-transform:uppercase;letter-spacing:.3em;text-align:center">' +
        '<button class="btn-primary" id="btnNetJoin">Room me Juden</button>' +
      '</div>' +
    '</div>' +
    '<p class="hint">Host ke paas server chalna chahiye — README-ONLINE.md me tareeqa he.</p>' +
    '<button class="btn-ghost" id="btnNetBack">Wapis</button>'
  );
  $('btnNetCreate').addEventListener('click', () => {
    sfx('click');
    const name = ($('netName').value || '').trim() || 'Khiladi';
    netConnect(netWsUrl(), () => netSend({ t: 'create', name }));
  });
  $('btnNetJoin').addEventListener('click', () => {
    sfx('click');
    const name = ($('netName').value || '').trim() || 'Khiladi';
    const code = ($('netCode').value || '').trim().toUpperCase();
    if (!code){ toast('Room code daalein'); return; }
    netConnect(netWsUrl(), () => netSend({ t: 'join', room: code, name }));
  });
  $('btnNetBack').addEventListener('click', () => { sfx('click'); openStartModal(); });
}
function openLobby(){
  const seats = [0, 1, 2, 3].map(i =>
    '<div class="khowasha-partner" style="justify-content:space-between">' +
      '<span class="kp-name">ID ' + (i + 1) + ' · ' + esc(NET.names[i] || '— intezar —') + '</span>' +
      (i === NET.seat ? '<span class="kp-mark sahi">AAP</span>' : (NET.names[i] ? '<span class="kp-mark sahi">✓</span>' : '<span class="kp-mark">…</span>')) +
    '</div>'
  ).join('');
  const ready = NET.names.filter(Boolean).length;
  openOverlay(
    '<div class="modal-head">Room: <span class="gold" style="letter-spacing:.25em">' + esc(NET.room || '') + '</span></div>' +
    '<p class="sub">Yeh code doston ko bhejein — wo <b>Room me Juden</b> se aayenge.<br>Khiladi: <b>' + ready + '/4</b></p>' +
    seats +
    (NET.host
      ? '<div class="modal-actions"><button class="btn-primary" id="btnLobbyGo"' + (ready >= 4 ? '' : ' disabled style="opacity:.5"') + '>Khel Shuru Karein ♠</button></div>'
      : '<p class="hint" style="text-align:center">Host ke shuru karne ka intezar…</p>') +
    '<button class="btn-ghost" id="btnLobbyLeave">Room Chhodein</button>'
  );
  if (NET.host){
    const go = $('btnLobbyGo');
    if (go) go.addEventListener('click', () => {
      if ((NET.names.filter(Boolean).length) < 4){ toast('4 khiladi chahiye'); return; }
      sfx('click');
      netSend({ t: 'go' });
    });
  }
  const lv = $('btnLobbyLeave');
  if (lv) lv.addEventListener('click', () => {
    sfx('click');
    netSend({ t: 'leave' });
    try { if (NET.ws) NET.ws.close(); } catch(e){}
    NET.on = false; NET.ws = null; NET.room = null;
    openStartModal();
  });
}

/* host ka har render -> sab ko naya view */
const _netRenderBase = render;
render = function(){
  _netRenderBase();
  netBroadcast();
};

/* ============================================================
   WIRE UP
   ============================================================ */
function onNewMatch(){
  sfx('click');
  if (G) startMatch(setup);
  else openStartModal();
}

function init(){
  try{ soundOn = localStorage.getItem('cp_sound') !== '0'; } catch(e){}
  updateSoundBtn();
  $('btnRules').addEventListener('click', () => openRulesModal(null));
  $('btnSound').addEventListener('click', toggleSound);
  $('btnNew').addEventListener('click', onNewMatch);
  document.addEventListener('pointerdown', initAudio);
  document.addEventListener('click', e => {
    if (!e.target || !e.target.closest || !G) return;
    const k = e.target.closest('.khowasha-btn');
    if (k){ sfx('click'); setKhowasha(k.dataset.khowasha); return; }
    const sl = e.target.closest('[data-slam]');
    if (sl){ sfx('click'); toggleSlam(); return; }
    const b = e.target.closest('[data-call]');
    if (!b) return;
    if (b.dataset.call === 'kot') callKot();
    else if (b.dataset.call === 'peace') callPeace();
  });
  openStartModal();
}

/* test / debug hooks */
window.CP = {
  get state(){ return G; },
  stats,
  startMatch,
  nextRound,
  applyTrump,
  doPlay,
  legalCards,
  legalFromHand,
  aiChoose,
  setSpeed(v){ SPEED = v; },
  setManual(v){ window.__CP_MANUAL = !!v; },
  setAutoHuman(v){
    window.__CP_AUTO_HUMAN = !!v;
    if (window.__CP_AUTO_HUMAN && G && G.phase === 'playing' && G.turn === G.humanSeat && !G.busy && !G.paused) drive();
  },
  _beats: beats,
  _bestOfTrick: bestOfTrick,
  _needStreak: needStreak,
  _callKot: callKot,
  _kotAccepted: kotAccepted,
  _kotDenied: kotDenied,
  _peaceAccepted: peaceAccepted,
  _peaceDenied: peaceDenied,
  _aiMaybeCall: aiMaybeCall,
  _setKhowasha: setKhowasha,
  _setKhowashaPartner: setKhowashaPartner,
  _evaluateKhowasha: evaluateKhowasha,
  _canSlam: canSlam,
  _armSlam(v){ slamArmed = !!v; render(); },
  _isSlamArmed(){ return slamArmed; },
  _callPeace: callPeace,
  _sortHand: sortHand,
  _pressChakka: pressChakka,
  _resolveChakka: resolveChakka,
  _continueDeal: continueDealAfterTrump,
  _suitLayout: suitLayout,
  _render: render,
  _endRound: endRound,
  _resolveTrick: resolveTrick
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
